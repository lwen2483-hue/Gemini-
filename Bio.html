<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bundle ID Finder</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #1e1e2e;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --text: #e2e8f0;
    --muted: #64748b;
    --success: #10b981;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
  }

  html { background: var(--bg); }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 16px 48px;
  }

  /* Header */
  .header {
    margin-bottom: 32px;
    animation: slideDown 0.5s ease;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(0,212,255,0.25);
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
    background: rgba(0,212,255,0.05);
  }

  .header-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }

  h1 {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #fff;
  }

  h1 span {
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,0.4);
  }

  .subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.5;
  }

  /* Search box */
  .search-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    animation: slideUp 0.5s ease 0.1s both;
    transition: border-color 0.2s;
  }

  .search-box:focus-within {
    border-color: rgba(0,212,255,0.4);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.06);
  }

  .search-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
  }

  .search-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }

  input[type="text"]::placeholder { color: var(--muted); }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  .region-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    cursor: pointer;
    min-width: 64px;
    text-align: center;
  }

  .btn-search {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .btn-search:active { opacity: 0.8; transform: scale(0.97); }
  .btn-search:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Country tabs */
  .region-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .region-chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .region-chip.active {
    background: rgba(0,212,255,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 32px;
    animation: fadeIn 0.3s ease;
  }

  .loading.show { display: block; }

  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
  }

  .loading-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* Results */
  .results { animation: slideUp 0.4s ease; }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .results-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .results-count span { color: var(--accent); }

  .app-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: slideUp 0.35s ease both;
    transition: border-color 0.15s;
  }

  .app-card:active { border-color: rgba(0,212,255,0.3); }

  .app-icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    flex-shrink: 0;
    background: var(--border);
    overflow: hidden;
  }

  .app-icon img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }

  .app-info { flex: 1; min-width: 0; }

  .app-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-dev {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bundle-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
  }

  .bundle-id {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .btn-copy {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 14px;
    flex-shrink: 0;
    transition: color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-copy:active { color: var(--success); }
  .btn-copy.copied { color: var(--success); }

  /* Empty / Error */
  .state-box {
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 0.3s ease;
  }

  .state-icon { font-size: 36px; margin-bottom: 12px; }

  .state-title {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .state-sub { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(32px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--success);
    color: #000;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 100px;
    letter-spacing: 0.08em;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @keyframes slideDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp   { from { opacity:0; transform:translateY(12px); }  to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn    { from { opacity:0; } to { opacity:1; } }
  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes pulse     { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-badge">iOS Tool</div>
    <h1>Bundle <span>ID</span><br>Finder</h1>
    <p class="subtitle">搜索 App Store 应用，一键复制 Bundle ID</p>
  </div>

  <div class="search-box">
    <span class="search-label">// 搜索应用</span>
    <div class="search-row">
      <input type="text" id="queryInput" placeholder="微信 / YouTube / TikTok…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn-search" id="searchBtn" onclick="doSearch()">搜索</button>
    </div>
    <div class="region-row">
      <button class="region-chip active" onclick="setRegion(this,'cn')">🇨🇳 中国</button>
      <button class="region-chip" onclick="setRegion(this,'us')">🇺🇸 美区</button>
      <button class="region-chip" onclick="setRegion(this,'hk')">🇭🇰 香港</button>
      <button class="region-chip" onclick="setRegion(this,'jp')">🇯🇵 日本</button>
      <button class="region-chip" onclick="setRegion(this,'gb')">🇬🇧 英国</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">正在查询 App Store…</div>
  </div>

  <div id="results"></div>

</div>

<div class="toast" id="toast">已复制 ✓</div>

<script>
let currentRegion = 'cn';

function setRegion(el, region) {
  document.querySelectorAll('.region-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentRegion = region;
}

document.getElementById('queryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

async function doSearch() {
  const q = document.getElementById('queryInput').value.trim();
  if (!q) return;

  const btn = document.getElementById('searchBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');

  btn.disabled = true;
  loading.classList.add('show');
  results.innerHTML = '';

  try {
    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&country=${currentRegion}&entity=software&limit=15`;
    const res = await fetch(url);
    const data = await res.json();

    loading.classList.remove('show');

    if (!data.results || data.results.length === 0) {
      results.innerHTML = `
        <div class="state-box">
          <div class="state-icon">🔍</div>
          <div class="state-title">未找到结果</div>
          <div class="state-sub">换个关键词试试，或切换到其他区域</div>
        </div>`;
    } else {
      renderResults(data.results);
    }
  } catch (err) {
    loading.classList.remove('show');
    results.innerHTML = `
      <div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-title">请求失败</div>
        <div class="state-sub">请检查网络连接后重试<br><small style="color:#475569">${err.message}</small></div>
      </div>`;
  }

  btn.disabled = false;
}

function renderResults(apps) {
  const results = document.getElementById('results');
  const header = `<div class="results-header results-count">找到 <span>${apps.length}</span> 个应用</div>`;

  const cards = apps.map((app, i) => {
    const name = escHtml(app.trackName || '未知应用');
    const dev  = escHtml(app.artistName || '');
    const bid  = escHtml(app.bundleId || '');
    const icon = app.artworkUrl60 || app.artworkUrl100 || '';

    return `
    <div class="app-card" style="animation-delay:${i * 0.04}s">
      <div class="app-icon">
        ${icon ? `<img src="${icon}" alt="" loading="lazy">` : ''}
      </div>
      <div class="app-info">
        <div class="app-name" title="${name}">${name}</div>
        <div class="app-dev">${dev}</div>
        <div class="bundle-row">
          <span class="bundle-id" title="${bid}">${bid}</span>
          <button class="btn-copy" onclick="copyBundleId(this, '${bid}')" title="复制">⎘</button>
        </div>
      </div>
    </div>`;
  }).join('');

  results.innerHTML = header + `<div class="results">${cards}</div>`;
}

function copyBundleId(btn, id) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(id).then(() => showToast(btn));
  } else {
    const ta = document.createElement('textarea');
    ta.value = id;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(btn);
  }
}

function showToast(btn) {
  btn.classList.add('copied');
  btn.textContent = '✓';
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '⎘'; }, 2000);

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
